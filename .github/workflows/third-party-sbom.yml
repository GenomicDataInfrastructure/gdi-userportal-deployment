# One CycloneDX SBOM per third-party image in docker-compose.yml (built images included, so the
# nginx, postgres and keycloak SBOMs cover their base images), a Go check for CVE-2026-111943 over
# every image the deployment runs (GDI images through the SBOMs attached to their releases), and
# components.json, which links each GDI image to its release SBOM.
name: Third-party SBOM

on:
  pull_request:
    paths:
      - docker-compose.yml
      - nginx/**
      - postgresql17/**
      - keycloak/**
      - scripts/check-go-stdlib.sh
      - scripts/go-binaries.py
      - scripts/go-stdlib-exceptions.txt
      - scripts/gdi-components.sh
      - scripts/gdi-release.sh
      - scripts/gdi-release-sbom.sh
      - .github/workflows/third-party-sbom.yml
  push:
    branches:
      - main
    paths:
      - docker-compose.yml
      - nginx/**
      - postgresql17/**
      - keycloak/**
      - scripts/check-go-stdlib.sh
      - scripts/go-binaries.py
      - scripts/go-stdlib-exceptions.txt
      - scripts/gdi-components.sh
      - scripts/gdi-release.sh
      - scripts/gdi-release-sbom.sh
      - .github/workflows/third-party-sbom.yml
  # Floating tags (postgres:17-alpine, the GDI :main images) change without a commit here.
  schedule:
    - cron: "0 5 * * 1"
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  images:
    name: List images
    runs-on: ubuntu-latest
    permissions:
      contents: read # checkout
    outputs:
      third-party: ${{ steps.list.outputs.third-party }}
      gdi: ${{ steps.list.outputs.gdi }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: List images from docker-compose.yml
        id: list
        # Third-party images: pulled ones by reference, built ones by context. GDI images: the
        # compose images plus GDI FROM lines of build contexts.
        run: |
          docker compose config --format json > compose.json
          third_party=$(jq -c --arg ws "$GITHUB_WORKSPACE/" '{include: [
            .services | to_entries[]
            | select((.value.image // "") | startswith("ghcr.io/genomicdatainfrastructure/") | not)
            | if .value.build then {name: .key, context: (.value.build.context | ltrimstr($ws))}
              else {name: .key, image: .value.image} end
          ]}' compose.json)
          gdi=$(scripts/gdi-components.sh --list < compose.json |
            jq -Rnc '{include: [inputs | split("\t") | {name: .[0], image: .[1]}]}')
          echo "$third_party" | jq .
          echo "$gdi" | jq .
          echo "third-party=$third_party" >> "$GITHUB_OUTPUT"
          echo "gdi=$gdi" >> "$GITHUB_OUTPUT"

  scan:
    name: Scan (${{ matrix.name }})
    needs: images
    runs-on: ubuntu-latest
    permissions:
      contents: read # checkout
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.images.outputs.third-party) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Pull or build image
        id: image
        env:
          NAME: ${{ matrix.name }}
          IMAGE: ${{ matrix.image }}
          CONTEXT: ${{ matrix.context }}
        # ref is what gets scanned; base names the image for the Go check's exceptions (for a
        # built image, its final FROM).
        run: |
          ref=$IMAGE
          base=$IMAGE
          if [ -n "$CONTEXT" ]; then
            ref="third-party-sbom/$NAME:${GITHUB_SHA}"
            base=$(awk 'toupper($1) == "FROM" { b = $2 } END { print b }' "$CONTEXT/Dockerfile")
            docker build -t "$ref" "$CONTEXT"
          else
            docker pull "$ref"
          fi
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
          echo "base=$base" >> "$GITHUB_OUTPUT"
      - name: Find Go binaries
        env:
          REF: ${{ steps.image.outputs.ref }}
        # Reads every ELF file's Go build info, including binaries installed by apt, apk or rpm,
        # which Trivy doesn't report as Go binaries.
        run: |
          id=$(docker create "$REF")
          docker export "$id" | python3 -I scripts/go-binaries.py > go-binaries.tsv
          docker rm "$id" > /dev/null
          cat go-binaries.tsv
      - name: Generate image SBOM
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.image.outputs.ref }}
          format: cyclonedx
          output: sbom-${{ matrix.name }}.cdx.json
          cache: "false"
      - name: Check Go binaries (CVE-2026-111943)
        env:
          NAME: ${{ matrix.name }}
          BASE: ${{ steps.image.outputs.base }}
        run: scripts/check-go-stdlib.sh "$BASE" "sbom-$NAME.cdx.json" go-binaries.tsv
      - name: Upload SBOM
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom-${{ matrix.name }}
          path: sbom-${{ matrix.name }}.cdx.json
          if-no-files-found: error

  gdi:
    name: Go check (${{ matrix.name }})
    needs: images
    runs-on: ubuntu-latest
    permissions:
      contents: read # checkout, release SBOM downloads
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.images.outputs.gdi) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download release SBOM
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE: ${{ matrix.image }}
        run: scripts/gdi-release-sbom.sh "$IMAGE" sbom.cdx.json
      - name: Check Go binaries (CVE-2026-111943)
        if: ${{ hashFiles('sbom.cdx.json') != '' }}
        env:
          IMAGE: ${{ matrix.image }}
        # Release SBOMs come from Trivy, which doesn't report Go binaries installed by apt, apk or
        # rpm (e.g. Ubuntu's gosu in the Solr image), so those aren't checked here.
        run: |
          echo "Go binaries installed by apt, apk or rpm aren't in release SBOMs and aren't checked." >> "$GITHUB_STEP_SUMMARY"
          scripts/check-go-stdlib.sh "$IMAGE" sbom.cdx.json

  components:
    name: GDI components
    runs-on: ubuntu-latest
    permissions:
      contents: read # checkout, release lookups
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Write components.json
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          docker compose config --format json | scripts/gdi-components.sh > components.json
          cat components.json
      - name: Upload components.json
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: components
          path: components.json
          if-no-files-found: error
