# LNDS trust store, generated by scripts/build-truststore.sh (see truststore/README.md).
x-lnds-trust-env: &lnds-trust-env
  SSL_CERT_FILE: /etc/lnds/ca-bundle.pem
  REQUESTS_CA_BUNDLE: /etc/lnds/ca-bundle.pem

volumes:
  ckan_storage:
    driver: local
  pg_data_17:
    driver: local
  solr_data:
    driver: local

services:
  nginx:
    build:
      context: nginx/
      dockerfile: Dockerfile
    depends_on:
      frontend:
        condition: service_healthy
      kong:
        condition: service_healthy
      ckan:
        condition: service_healthy
      rems:
        condition: service_healthy
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - 80:80

  frontend:
    image: ghcr.io/genomicdatainfrastructure/gdi-userportal-frontend:1.7.21
    depends_on:
      kong:
        condition: service_healthy
    restart: unless-stopped
    env_file:
      - .env
      - .env.secrets
    environment:
      <<: *lnds-trust-env
      NODE_OPTIONS: --use-openssl-ca
    volumes:
      - ./truststore/ca-bundle.pem:/etc/lnds/ca-bundle.pem:ro
    healthcheck:
      test:
        ["CMD", "curl", "-o", "/dev/null", "http://localhost:3000/api/health"]

  ckan:
    image: ghcr.io/genomicdatainfrastructure/gdi-userportal-ckan-docker:1.5.5
    env_file:
      - .env.ckan
      - .env.secrets
    depends_on:
      postgres:
        condition: service_healthy
      solr:
        condition: service_healthy
      redis:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    environment: *lnds-trust-env
    volumes:
      - ckan_storage:/var/lib/ckan
      - ./truststore/ca-bundle.pem:/etc/lnds/ca-bundle.pem:ro
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 4G
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO", "/dev/null", "http://localhost:5000"]
      interval: 5s
      retries: 3
      start_period: 60s

  postgres:
    build:
      context: postgresql17/
    env_file:
      - .env
      - .env.secrets
    volumes:
      - pg_data_17:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test:
        ["CMD", "pg_isready", "-U", "${POSTGRES_USER}", "-d", "${POSTGRES_DB}"]

  solr:
    image: ghcr.io/genomicdatainfrastructure/gdi-userportal-solr:1.14.4
    volumes:
      - solr_data:/var/solr
    restart: unless-stopped
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 4G
    healthcheck:
      test: ["CMD", "wget", "-qO", "/dev/null", "http://localhost:8983/solr/"]

  redis:
    image: redis:8.6.7@sha256:e6dae84f7db289dde3384fdb18d182556784e5a681df3a3f54d1289952364ce8
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "-e", "QUIT"]

  keycloak:
    build:
      context: keycloak/
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env.keycloak
      - .env.secrets
    ports:
      - 8080:8080
    volumes:
      - ./keycloak/realms:/opt/keycloak/data/import:ro
      - ./truststore/cacerts:/etc/pki/ca-trust/extracted/java/cacerts:ro
    healthcheck:
      test:
        ["CMD", "curl", "-o", "/dev/null", "http://localhost:8080/health/ready"]
      interval: 5s
      retries: 3
      start_period: 60s

  kong:
    image: kong/kong-gateway:3.13.0.11@sha256:58423624bb31b185dfc08e973d80164d98c4792c742da2bc9942ec74ced61d9e
    restart: unless-stopped
    depends_on:
      dataset-discovery-service:
        condition: service_healthy
      access-management-service:
        condition: service_healthy
    env_file:
      - .env
    healthcheck:
      test: ["CMD", "kong", "health"]
    volumes:
      - ./kong/kong.yml:/etc/kong/kong.yml

  access-management-service:
    image: ghcr.io/genomicdatainfrastructure/gdi-userportal-access-management-service:1.4.3
    restart: unless-stopped
    env_file:
      - .env
      - .env.secrets
    volumes:
      - ./truststore/cacerts:/work/cacerts:ro
    depends_on:
      keycloak:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-o", "/dev/null", "http://localhost:8080/q/health"]

  rems:
    image: cscfi/rems:v2.39
    env_file:
      - .env
      - .env.secrets
    volumes:
      - ./rems/config.edn:/rems/config/config.edn
      - ./rems/styles.css:/rems/theme/styles.css
      - ./rems/theme.edn:/rems/theme/theme.edn
      - ./rems/en.edn:/rems/theme/extra-translations/en.edn
      - ./rems/logo_medium.png:/rems/theme/public/img/logo_medium.png
      - ./rems/logo_small.png:/rems/theme/public/img/logo_small.png
      - ./rems/ls_login.png:/rems/theme/public/img/ls_login.png
      - ./rems/private-key.jwk:/rems/keys/private-key.jwk
      - ./rems/public-key.jwk:/rems/keys/public-key.jwk
      - ./truststore/cacerts:/opt/java/openjdk/lib/security/cacerts:ro
    depends_on:
      keycloak:
        condition: service_healthy
    healthcheck:
      test:
        ["CMD", "wget", "-qO", "/dev/null", "http://localhost:3000/api/health"]

  synchronizer:
    image: ghcr.io/genomicdatainfrastructure/gdi-userportal-rems-synchronizer:1.3.6
    depends_on:
      rems:
        condition: service_healthy
      ckan:
        condition: service_healthy
    env_file:
      - .env
      - .env.secrets
    environment: *lnds-trust-env
    volumes:
      - ./truststore/ca-bundle.pem:/etc/lnds/ca-bundle.pem:ro

  dataset-discovery-service:
    image: ghcr.io/genomicdatainfrastructure/gdi-userportal-dataset-discovery-service:1.6.4
    restart: unless-stopped
    env_file:
      - .env
      - .env.secrets
    volumes:
      - ./truststore/cacerts:/work/cacerts:ro
    depends_on:
      keycloak:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-o", "/dev/null", "http://localhost:8080/q/health"]
