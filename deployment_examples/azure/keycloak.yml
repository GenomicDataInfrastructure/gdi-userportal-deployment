version: "3"
services:
  keycloak:
    environment:
      # ART-31067 / CVE-2026-114938: retain until the bundled JDK is confirmed fixed.
      JAVA_TOOL_OPTIONS: "${JAVA_TOOL_OPTIONS:-} -XX:-UseBASE64Intrinsics"
    image: quay.io/keycloak/keycloak:23.0.3
    ports:
      - "8080:8080"
    volumes:
      - ${WEBAPP_STORAGE_HOME}/data:/opt/keycloak/data/
    restart: unless-stopped
    command: start --proxy=edge --hostname-strict=false --hostname-strict-https=false